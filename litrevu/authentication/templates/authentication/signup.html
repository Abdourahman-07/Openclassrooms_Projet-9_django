{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block content %}
<section class="signup" aria-labelledby="titre-inscription">
    <h1 id="titre-inscription">Inscrivez-vous</h1>
    <p class="form-note">Tous les champs sont obligatoires.</p>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "_non_field_errors.html" %}
        {% for field in form %}
            {% include "_form_field.html" %}
        {% endfor %}
        <div class="form-actions">
            <a class="button" href="{% url 'login' %}">Retourner</a>
            <button type="submit" class="button">S'inscrire</button>
        </div>
    </form>
</section>
{% endblock %}
