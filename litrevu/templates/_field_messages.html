{# Aide et erreurs d'un champ ; identifiants référencés par aria-describedby #}
{% if field.help_text %}
    <div id="{{ field.auto_id }}_helptext" class="help-text">{{ field.help_text|safe }}</div>
{% endif %}
{% if field.errors %}
    <ul id="{{ field.auto_id }}_errors" class="field-errors">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
{% endif %}
